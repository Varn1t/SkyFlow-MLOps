version: '3.8'

x-airflow-common:
  &airflow-common
  build: .
  environment:
    AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    MLFLOW_TRACKING_URI: http://mlflow:5000
    OLLAMA_HOST: http://ollama:11434
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/airflow.db:/opt/airflow/airflow.db
    - ./airflow/webserver_config.py:/opt/airflow/webserver_config.py
    - ./data:/app/data
    - ./models:/app/models
    - ./src:/app/src
  working_dir: /app
  depends_on:
    - mlflow
    - ollama

services:
  mlflow:
    image: python:3.11-slim
    command: >
      bash -c "pip install mlflow==3.12.0 -q &&
               mlflow server --host 0.0.0.0 --port 5000
               --backend-store-uri sqlite:////mlflow/mlflow.db
               --default-artifact-root /mlflow/artifacts"
    ports:
      - "5000:5000"
    volumes:
      - ./mlartifacts:/mlflow/artifacts
      - ./mlflow.db:/mlflow/mlflow.db

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  airflow-init:
    <<: *airflow-common
    command: bash -c "airflow db init && airflow users create --username admin --password admin --firstname Varnit --lastname Dev --role Admin --email admin@example.com"

  airflow-webserver:
    <<: *airflow-common
    command: airflow webserver --port 8080
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    depends_on:
      - airflow-init

volumes:
  ollama_data: